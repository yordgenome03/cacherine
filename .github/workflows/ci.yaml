name: Run Tests

on:
  pull_request:
    branches:
      - main
      - develop
      - release/**

permissions:
  contents: read

jobs:
  format-suggestions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
        timeout-minutes: 2

      - name: Cache Dart dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-stable-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-stable-
            ${{ runner.os }}-pub-
        timeout-minutes: 2

      - name: Install dependencies
        run: dart pub get
        timeout-minutes: 3

      - name: Apply formatting
        run: dart format .
        timeout-minutes: 2

      - name: Suggest formatting fixes via Reviewdog and Fail CI
        uses: reviewdog/action-suggester@v1
        with:
          tool_name: dart format
          github_token: ${{ secrets.GITHUB_TOKEN }}
          filter_mode: added
          fail_on_error: true
        timeout-minutes: 2

  test-matrix:
    name: test (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.8.0', 'stable']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
        timeout-minutes: 2

      - name: Cache Dart dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ matrix.sdk }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ matrix.sdk }}-
            ${{ runner.os }}-pub-
        timeout-minutes: 2

      - name: Install dependencies
        run: dart pub get
        timeout-minutes: 3

      - name: Check outdated dependencies
        run: dart pub outdated
        timeout-minutes: 2

      - name: Analyze project source with strict mode
        run: dart analyze --fatal-infos
        timeout-minutes: 2

      - name: Run tests with coverage
        run: dart test --coverage=coverage/
        timeout-minutes: 5

      - name: Convert coverage to lcov
        run: dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
        timeout-minutes: 2

      - name: Upload coverage to Codecov
        if: matrix.sdk == '3.8.0'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: true
        timeout-minutes: 3

      - name: Validate package before publishing
        run: dart pub publish --dry-run
        timeout-minutes: 2

  # Aggregates test-matrix's per-SDK results under a single check literally
  # named "test" — the repo's branch ruleset requires a status check with
  # that exact name, which a matrixed job can never report on its own (each
  # leg reports as "test (<sdk>)" instead). Without this, the required
  # check sits at "Waiting for status to be reported" forever.
  test:
    name: test
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always()
    steps:
      - name: Fail if any test-matrix leg failed
        run: |
          if [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "test-matrix result: ${{ needs.test-matrix.result }}"
            exit 1
          fi

  # Diffs this branch's public API against the latest version published on
  # pub.dev using dart_apitool (https://pub.dev/packages/dart_apitool), and
  # fails only if it finds a breaking change not matched by a major version
  # bump (--version-check-mode onlyBreakingChanges). Deliberately does NOT
  # use the stricter "fully" mode, which would also require every additive
  # (non-breaking) change to already carry its eventual minor bump — this
  # repo bumps pubspec.yaml's version as a release-time step, not per-PR, so
  # "fully" mode would fail on every PR that adds new public API without
  # yet bumping the version (true as of this job's own introduction: see
  # CHANGELOG's "Unreleased" section for several additions still sitting on
  # the currently-published version). "onlyBreakingChanges" instead mirrors
  # exactly what this project already polices by hand (CHANGELOG's own
  # "### Breaking Changes" precedent) without that false-positive.
  api-diff:
    name: api-diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
        timeout-minutes: 2

      - name: Install dart_apitool
        run: dart pub global activate dart_apitool
        timeout-minutes: 3

      - name: Diff public API against the latest published version
        run: |
          dart pub global run dart_apitool:main diff \
            --old "pub://cacherine" \
            --new "." \
            --report-format markdown \
            --report-file-path api-diff-report.md \
            --version-check-mode onlyBreakingChanges
        timeout-minutes: 5

      - name: Upload API diff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-diff-report
          path: api-diff-report.md
          retention-days: 30
        timeout-minutes: 2
